name: Tests

# Red de seguridad de la fase 0.1 (auditoria 2026-09, SA8). Corre TODO el suite.
# El subconjunto `smoke` ademas corre dentro de sync.yml antes de tocar datos.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinneadas por SHA, no por tag: misma politica que sync.yml (auditoria
      # 2026-07 B8). Son los MISMOS SHA que usa sync.yml hoy.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Mismo guard que sync.yml, pero aca corre en cada push: caza la ruta
      # hardcodeada ANTES de que rompa una corrida de datos.
      - name: Guard - sin rutas hardcodeadas en los scripts
        run: |
          if grep -rnE '^[A-Za-z_]+ *= *(Path\()?r?"[A-Z]:' scripts/*.py; then
            echo "::error::Hay un BASE/ruta hardcodeada a una ruta local: rompe en Actions. Usar GASTOS_BASE o __file__."
            exit 1
          fi
          echo "sin rutas hardcodeadas"

      - name: pytest (suite completo)
        run: python -m pytest -q -rxX
