name: Sync gastos

# Corre el pipeline de gastos en la nube (reemplaza las tareas de Windows).
# Fase 1 (fetch): fetch_mails.py (Gmail API determinística).
# Fase 2 (pipeline): splitwise -> procesar_mails -> validación -> dashboard -> Sheets -> commit.
#
# MODO (desde el cutover del 2026-07-16, Actions es el ÚNICO dueño del pipeline;
# las tareas de Windows "Gastos Sync AM/PM" quedaron deshabilitadas):
#   - live: corre todo y ADEMÁS genera dashboards, actualiza Sheets y hace commit+push.
#     Es lo que corre siempre por cron. No depende de ninguna variable de repo: una
#     variable mal seteada dejaría el pipeline sin commitear EN SILENCIO (= los datos
#     dejan de actualizarse y nadie se entera). Para pausar el sync, deshabilitá el
#     workflow desde la UI (Actions -> Sync gastos -> ... -> Disable workflow): eso se ve.
#   - shadow: corre fetch + pipeline + validación pero NO commitea/pushea ni toca Sheets.
#     Sirvió para la semana de validación en paralelo; hoy queda solo para probar a mano
#     un cambio del pipeline sin ensuciar el repo (elegirlo en el dropdown del dispatch).

on:
  schedule:
    - cron: '23 12 * * *'   # ~09:23 Uruguay (UTC-3)
    - cron: '23 0 * * *'    # ~21:23 Uruguay
  workflow_dispatch:
    inputs:
      mode:
        description: 'live (commit+push+sheets) | shadow (no push, para probar cambios)'
        type: choice
        options: [live, shadow]
        default: live

concurrency:
  group: sync-gastos
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ github.event.inputs.mode || 'live' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Guard barato: un BASE hardcodeado a la ruta de Windows de Joaco rompe el
      # script solo en la nube (paso silenciosamente por 2 veces: conciliar_estado
      # y cierre_casa). Se chequea la ASIGNACION, no los ejemplos de uso en docstrings.
      - name: Guard - sin rutas hardcodeadas en los scripts
        run: |
          if grep -rnE '^[A-Za-z_]+ *= *(Path\()?r?"[A-Z]:' scripts/*.py; then
            echo "::error::Hay un BASE/ruta hardcodeada a una ruta local: rompe en Actions. Usar GASTOS_BASE o __file__."
            exit 1
          fi
          echo "sin rutas hardcodeadas"

      - name: Fetch mails (Gmail API)
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scripts/fetch_mails.py

      - name: Sync Splitwise
        env:
          SPLITWISE_API_KEY: ${{ secrets.SPLITWISE_API_KEY }}
        run: |
          python scripts/sync_splitwise.py || echo "::warning::sync_splitwise falló — el pipeline siguió sin Splitwise"

      - name: Procesar mails
        run: |
          set -o pipefail
          python scripts/procesar_mails.py | tee /tmp/proc.txt

      - name: Validar (falla si hay ERROR/DESVIO fuera del baseline 2c)
        run: |
          set -o pipefail
          python scripts/merge_y_validar.py | tee /tmp/val.txt
          if grep -E '\[(ERROR|DESVIO)\]' /tmp/val.txt | grep -vq '2c\.doble_conteo'; then
            echo "::error::Validación con ERROR/DESVIO nuevo (fuera del baseline 2c documentado)"
            grep -E '\[(ERROR|DESVIO)\]' /tmp/val.txt | grep -v '2c\.doble_conteo' || true
            exit 1
          fi

      - name: Dashboards + Sheets + commit (solo live)
        if: env.MODE == 'live'
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          python scripts/cierre_casa.py || echo "::warning::cierre_casa falló — la posición de casa quedó con el valor previo"
          python scripts/generar_dashboard_data.py
          python scripts/generar_dashboard_html.py || echo "::warning::generar_dashboard_html falló — out/dashboard.html quedó con datos previos"
          python scripts/actualizar_sheets.py || echo "::warning::actualizar_sheets falló — Looker quedó con datos previos"
          git config user.name "gastos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "sin cambios para commitear"
          else
            git commit -m "sync automático (Actions) $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: Avisar pendientes nuevos (abre Issue -> te llega mail)
        if: env.MODE == 'live'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(grep -oE 'pendientes nuevos: *[0-9]+' /tmp/proc.txt | grep -oE '[0-9]+' | head -1 || true)
          N=${N:-0}
          if [ "$N" -gt 0 ]; then
            DET=$(grep -A6 'pendientes nuevos:' /tmp/proc.txt | tail -n +2 | grep -E '^\s+\S' | head -6 || true)
            BODY=$(printf 'La corrida automática dejó **%s pendiente(s)** para revisar:\n\n```\n%s\n```\n\nPara resolverlos: abrí una sesión de Claude y corré `/revisar-pendientes`.\n' "$N" "$DET")
            gh issue create --title "🔎 $N pendiente(s) nuevo(s) en el sync de gastos" --body "$BODY" \
              || echo "(aviso: no se pudo crear el Issue)"
          else
            echo "sin pendientes nuevos"
          fi

      - name: Resumen shadow (no commitea)
        if: env.MODE != 'live'
        run: |
          {
            echo "### Modo SHADOW — no se commiteó (la PC sigue siendo dueña)"
            echo "Cambios que el pipeline HABRÍA agregado:"
            echo '```'
            git status --short
            echo "--- filas nuevas/cambiadas en ledger.csv ---"
            git diff --stat data/ledger.csv data/pendientes.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
