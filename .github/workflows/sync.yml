name: Sync gastos

# Corre el pipeline de gastos en la nube (reemplaza las tareas de Windows).
# Fase 1 (fetch): fetch_mails.py (Gmail API determinística).
# Fase 2 (pipeline): splitwise -> procesar_mails -> validación -> dashboard -> Sheets -> commit.
#
# MODO (desde el cutover del 2026-07-16, Actions es el ÚNICO dueño del pipeline;
# las tareas de Windows "Gastos Sync AM/PM" quedaron deshabilitadas):
#   - live: corre todo y ADEMÁS genera dashboards, actualiza Sheets y hace commit+push.
#     Es lo que corre siempre por cron. No depende de ninguna variable de repo: una
#     variable mal seteada dejaría el pipeline sin commitear EN SILENCIO (= los datos
#     dejan de actualizarse y nadie se entera). Para pausar el sync, deshabilitá el
#     workflow desde la UI (Actions -> Sync gastos -> ... -> Disable workflow): eso se ve.
#   - shadow: corre fetch + pipeline + validación pero NO commitea/pushea ni toca Sheets.
#     Sirvió para la semana de validación en paralelo; hoy queda solo para probar a mano
#     un cambio del pipeline sin ensuciar el repo (elegirlo en el dropdown del dispatch).

on:
  schedule:
    - cron: '23 12 * * *'   # ~09:23 Uruguay (UTC-3)
    - cron: '23 0 * * *'    # ~21:23 Uruguay
  workflow_dispatch:
    inputs:
      mode:
        description: 'live (commit+push+sheets) | shadow (no push, para probar cambios)'
        type: choice
        options: [live, shadow]
        default: live

concurrency:
  group: sync-gastos
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ github.event.inputs.mode || 'live' }}
    steps:
      # Pinneadas por SHA, no por tag (auditoria 2026-07 B8): el job corre con los
      # secrets de Gmail/Splitwise/service-account en el entorno, y un tag (v4) es
      # movible -- quien controle el repo de la action puede reapuntarlo a codigo
      # nuevo. El SHA es inmutable. Para actualizar: resolver el SHA nuevo con
      #   gh api repos/actions/checkout/commits/vX --jq .sha
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Guard barato: un BASE hardcodeado a la ruta de Windows de Joaco rompe el
      # script solo en la nube (paso silenciosamente por 2 veces: conciliar_estado
      # y cierre_casa). Se chequea la ASIGNACION, no los ejemplos de uso en docstrings.
      - name: Guard - sin rutas hardcodeadas en los scripts
        run: |
          if grep -rnE '^[A-Za-z_]+ *= *(Path\()?r?"[A-Z]:' scripts/*.py; then
            echo "::error::Hay un BASE/ruta hardcodeada a una ruta local: rompe en Actions. Usar GASTOS_BASE o __file__."
            exit 1
          fi
          echo "sin rutas hardcodeadas"

      - name: Fetch mails (Gmail API)
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scripts/fetch_mails.py

      # Los pasos NO CRITICOS van envueltos en salud_pasos.py: no frenan la
      # corrida si fallan, pero la racha queda registrada y a las 3 seguidas se
      # abre un Issue (auditoria 2026-07 M5). Con `|| echo ::warning::` a secas,
      # un paso podia fallar todos los dias sin que nadie se enterara.
      - name: Sync Splitwise
        env:
          SPLITWISE_API_KEY: ${{ secrets.SPLITWISE_API_KEY }}
        run: python scripts/salud_pasos.py correr sync_splitwise -- python scripts/sync_splitwise.py

      - name: Procesar mails
        run: |
          set -o pipefail
          python scripts/procesar_mails.py | tee /tmp/proc.txt

      # El script decide: sale != 0 si algun invariante del ledger esta roto.
      # Antes esto se decidia por grep sobre el stdout, y el grep NO miraba
      # [FALLO] -- el estado que merge_y_validar reserva para ids duplicados.
      # Un ledger corrupto pasaba en verde (auditoria 2026-07 A1).
      - name: Validar invariantes del ledger (si falla, no se commitea)
        run: |
          set -o pipefail
          if ! python scripts/merge_y_validar.py | tee /tmp/val.txt; then
            echo "::error::Invariante del ledger roto: el pipeline se detiene y NO commitea. Ver el detalle arriba."
            exit 1
          fi

      - name: Dashboards + Sheets (solo live)
        if: env.MODE == 'live'
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          python scripts/salud_pasos.py correr cierre_casa -- python scripts/cierre_casa.py
          python scripts/generar_dashboard_data.py
          python scripts/salud_pasos.py correr generar_dashboard_html -- python scripts/generar_dashboard_html.py
          python scripts/salud_pasos.py correr actualizar_sheets -- python scripts/actualizar_sheets.py

      # Dashboard con URL fija: Cloudflare Pages (deploy) + Access (candado).
      # No critico: si falla, la URL queda con la version anterior.
      #
      # SEGURIDAD (verificado 19/7): la app de Access DEBE cubrir DOS destinos:
      #   gastos-joacoguerrae.pages.dev   Y   *.gastos-joacoguerrae.pages.dev
      # Cada deploy crea una URL de preview inmutable (<hash>.gastos-...pages.dev)
      # que es publica: sin el comodin, el dashboard con datos financieros queda
      # accesible en esa URL sin login. El Path de cada destino va VACIO (un path
      # como '*.' no matchea la home '/' y deja pasar todo).
      #
      # PLACEHOLDER=1 durante el setup: hasta que el Access este configurado y
      # VERIFICADO, se publica una pagina vacia -- el dashboard real tiene datos
      # financieros y la URL seria publica mientras tanto. Flip a "0" recien
      # cuando curl a la URL devuelva el redirect a cloudflareaccess.com.
      # wrangler va pinneado exacto y via npx (sin action de terceros: la policy
      # del repo es solo-GitHub-owned, y el runner ya trae node).
      - name: Deploy dashboard a Cloudflare Pages (solo live)
        if: env.MODE == 'live'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Access (candado) configurado y VERIFICADO desde afuera el 19/7: las
          # URLs de gastos-joacoguerrae.pages.dev dan 302 -> cloudflareaccess.com
          # (login por mail joacoguerrae@gmail.com). Recien por eso PLACEHOLDER=0:
          # ya se puede publicar el dashboard real con datos financieros.
          PLACEHOLDER: "0"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare sin configurar (faltan secrets): se salta el deploy"
            exit 0
          fi
          mkdir -p /tmp/site
          if [ "$PLACEHOLDER" = "1" ]; then
            printf '<!doctype html><meta charset="utf-8"><title>pendiente</title><p>Configuración en curso.</p>' > /tmp/site/index.html
          else
            cp out/dashboard.html /tmp/site/index.html
          fi
          npx --yes wrangler@4.112.0 pages project create gastos-joacoguerrae --production-branch=master 2>/dev/null || true
          python scripts/salud_pasos.py correr deploy_dashboard -- npx --yes wrangler@4.112.0 pages deploy /tmp/site --project-name=gastos-joacoguerrae --branch=master --commit-dirty=true

      # Va ANTES del commit: escalar() marca el Issue como abierto en
      # data/staging/salud_pasos.json, y si eso no se commiteara, la corrida
      # siguiente abriria otro Issue por la misma racha.
      - name: Escalar pasos que fallan hace varias corridas (solo live)
        if: env.MODE == 'live'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/salud_pasos.py escalar

      - name: Commit + push (solo live)
        if: env.MODE == 'live'
        run: |
          git config user.name "gastos-bot"
          git config user.email "actions@users.noreply.github.com"
          # Paths EXPLICITOS, no -A (auditoria 2026-07 B2): el pipeline solo
          # escribe en data/, out/ y el watermark. Con -A, cualquier archivo
          # inesperado que aparezca en el arbol (un token volcado por error, un
          # temporal) se commitearia solo y en silencio.
          git add data out config/estado_sync.json
          if git diff --cached --quiet; then
            echo "sin cambios para commitear"
          else
            git commit -m "sync automático (Actions) $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: Avisar pendientes nuevos (abre Issue -> te llega mail)
        if: env.MODE == 'live'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(grep -oE 'pendientes nuevos: *[0-9]+' /tmp/proc.txt | grep -oE '[0-9]+' | head -1 || true)
          N=${N:-0}
          if [ "$N" -gt 0 ]; then
            DET=$(grep -A6 'pendientes nuevos:' /tmp/proc.txt | tail -n +2 | grep -E '^\s+\S' | head -6 || true)
            BODY=$(printf 'La corrida automática dejó **%s pendiente(s)** para revisar:\n\n```\n%s\n```\n\nPara resolverlos: abrí una sesión de Claude y corré `/revisar-pendientes`.\n' "$N" "$DET")
            gh issue create --title "🔎 $N pendiente(s) nuevo(s) en el sync de gastos" --body "$BODY" \
              || echo "(aviso: no se pudo crear el Issue)"
          else
            echo "sin pendientes nuevos"
          fi

      - name: Resumen shadow (no commitea)
        if: env.MODE != 'live'
        run: |
          {
            echo "### Modo SHADOW — no se commiteó (la PC sigue siendo dueña)"
            echo "Cambios que el pipeline HABRÍA agregado:"
            echo '```'
            git status --short
            echo "--- filas nuevas/cambiadas en ledger.csv ---"
            git diff --stat data/ledger.csv data/pendientes.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
